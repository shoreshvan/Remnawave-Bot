<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نتیجه پرداخت</title>
  <style>
    :root {
      --bg: #0a1119;
      --card: #121c28;
      --text: #ece6da;
      --muted: #93a0ae;
      --gold: #f1af3a;
      --green: #3ddc84;
      --red: #ff5a5a;
      --amber: #ffb020;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    .icon { font-size: 56px; line-height: 1; margin-bottom: 12px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
    .rows { text-align: right; margin: 16px 0; }
    .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 14px; }
    .row:last-child { border-bottom: none; }
    .row .k { color: var(--muted); }
    .row .v { font-weight: 600; }
    .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .btn {
      display: block;
      padding: 12px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
    }
    .btn-primary { background: var(--gold); color: #0a1119; }
    .btn-secondary { background: rgba(255,255,255,.08); color: var(--text); }
    .status-ok { color: var(--green); }
    .status-fail { color: var(--red); }
    .status-warn { color: var(--amber); }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon" id="icon">⏳</div>
    <h1 id="title">در حال بررسی...</h1>
    <p class="sub" id="sub"></p>
    <div class="rows" id="rows"></div>
    <div class="btns" id="btns"></div>
  </div>
  <script>
    (function () {
      var q = new URLSearchParams(window.location.search);
      var get = function (k, d) { var v = q.get(k); return (v === null || v === '') ? (d || '') : v; };

      var status = (get('status', '') || '').toLowerCase();
      var amount = get('amount', '');
      var invoice = get('invoice', '');
      var date = get('date', '');
      var reason = get('reason', '');
      var note = get('note', '');
      var back = get('back', '');
      var support = get('support', '');

      var iconEl = document.getElementById('icon');
      var titleEl = document.getElementById('title');
      var subEl = document.getElementById('sub');
      var rowsEl = document.getElementById('rows');
      var btnsEl = document.getElementById('btns');

      var ok = (status === 'ok' || status === 'success' || status === 'finished');
      var failed = (status === 'failed' || status === 'cancelled' || status === 'canceled');
      var underpaid = (status === 'underpaid' || note === 'underpaid' || reason === 'underpaid');

      if (ok) {
        iconEl.textContent = '✅';
        iconEl.className = 'icon status-ok';
        titleEl.textContent = 'پرداخت موفق';
        titleEl.className = 'status-ok';
        subEl.textContent = 'پرداخت شما با موفقیت تأیید شد و موجودی شارژ گردید.';
      } else if (underpaid) {
        iconEl.textContent = '⚠️';
        iconEl.className = 'icon status-warn';
        titleEl.textContent = 'پرداخت ناقص';
        titleEl.className = 'status-warn';
        subEl.textContent = 'مبلغ واریزی کمتر از مبلغ فاکتور است. پرداخت شما در انتظار بررسی پشتیبانی قرار گرفت.';
      } else if (failed) {
        iconEl.textContent = '❌';
        iconEl.className = 'icon status-fail';
        titleEl.textContent = 'پرداخت ناموفق';
        titleEl.className = 'status-fail';
        subEl.textContent = 'پرداخت انجام نشد یا لغو گردید.';
      } else {
        iconEl.textContent = 'ℹ️';
        titleEl.textContent = 'نتیجه پرداخت';
        subEl.textContent = 'وضعیت پرداخت شما ثبت شد.';
      }

      var rows = [];
      if (invoice) rows.push(['شماره فاکتور', invoice]);
      if (amount) rows.push(['مبلغ', amount + ' تومان']);
      if (date) rows.push(['تاریخ', date]);
      if (reason) rows.push(['علت', reason]);
      rows.forEach(function (r) {
        var div = document.createElement('div');
        div.className = 'row';
        var k = document.createElement('span'); k.className = 'k'; k.textContent = r[0];
        var v = document.createElement('span'); v.className = 'v'; v.textContent = r[1];
        div.appendChild(k); div.appendChild(v);
        rowsEl.appendChild(div);
      });

      if (back) {
        var a = document.createElement('a');
        a.className = 'btn btn-primary';
        a.href = back;
        a.textContent = 'بازگشت به ربات';
        btnsEl.appendChild(a);
      }
      if (support) {
        var s = document.createElement('a');
        s.className = 'btn btn-secondary';
        s.href = support;
        s.textContent = 'تماس با پشتیبانی';
        s.target = '_blank';
        s.rel = 'noopener';
        btnsEl.appendChild(s);
      }
    })();
  </script>
</body>
</html>
